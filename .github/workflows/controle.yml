name: controle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controle:
    name: controle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Plugins controleren
        run: node tools/valideer.mjs

      - name: Tests van de controle
        run: node tools/test.mjs

      - name: Index en galerij proefbouwen
        run: node tools/bouw-index.mjs
