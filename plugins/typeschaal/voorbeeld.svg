><text x="14" y="126" font-size="2.8" font-weight="700" fill="#268cff">H5</text><text font-size="2.5" fill="#737373"><tspan x="14" y="129.5">15,5 pt</tspan><tspan x="14" y="132.7">regelafstand 21 pt</tspan></text><text x="48.2" y="126" font-size="5.5" font-weight="700">Een goede kop zegt meer</text><path d="M14 136.5h292" fill="none" stroke="#d1d1d1" stroke-width="0.1"/><text x="14" y="142.3" font-size="2.8" font-weight="700" fill="#268cff">H6</text><text font-size="2.5" fill="#737373"><tspan x="14" y="145.8">12,5 pt</tspan><tspan x="14" y="149">regelafstand 17,5 pt</tspan></text><text x="48.2" y="142.3" font-size="4.4" font-weight="700">Een goede kop zegt meer</text><path d="M14 152.8h292" fill="none" stroke="#d1d1d1" stroke-width="0.1"/><text x="14" y="157.9" font-size="2.8" font-weight="700" fill="#268cff">Body</text><text font-size="2.5" fill="#737373"><tspan x="14" y="161.5">10 pt</tspan><tspan x="14" y="164.7">regelafstand 15 pt</tspan></text><text x="48.2" y="157.9" font-size="3.6">Goede typografie valt pas op als ze ontbreekt: rustige regels, genoeg wit en een duidelijke rangorde maken elke tekst prettig om te lezen.</text><path d="M14 168.4h292" fill="none" stroke="#d1d1d1" stroke-width="0.1"/><text x="14" y="173.5" font-size="2.8" font-weight="700" fill="#268cff">Klein</text><text font-size="2.5" fill="#737373"><tspan x="14" y="177.1">8 pt</tspan><tspan x="14" y="180.3">regelafstand 12 pt</tspan></text><text x="48.2" y="173.5" font-size="2.8">Goede typografie valt pas op als ze ontbreekt: rustige regels, genoeg wit en een duidelijke rangorde maken elke tekst prettig om te lezen.</text></g></svg>
